<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiroraTrack</title>
    <script data-theme-bootstrap>
      ;(() => {
        try {
          const raw =
            localStorage.getItem('miroratrack.preferences.v2') ??
            localStorage.getItem('miroratrack.preferences.v1')
          const stored = raw ? JSON.parse(raw) : null
          const preference =
            stored &&
            (stored.theme === 'light' ||
              stored.theme === 'dark' ||
              stored.theme === 'system')
              ? stored.theme
              : 'system'
          const resolved =
            preference === 'system'
              ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        } catch {
          let fallback = 'light'
          try {
            fallback = window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          } catch {}
          document.documentElement.dataset.theme = fallback
          document.documentElement.style.colorScheme = fallback
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
